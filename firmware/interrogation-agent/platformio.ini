; ESP32 Hardware Interrogation Agent
;
; Flash this to the ESP32 that has the component(s) under interrogation attached.
; The MCP server talks to it over USB serial via scripts/hw_bridge.py.
;
; Build & flash:
;   pio run -e esp32dev -t upload
;
; The agent is passive at boot: it configures no buses and drives no GPIO until
; an explicit request names the pins to use. Once a request names a pin, the
; agent will drive it — it is a general-purpose instrument, not a read-only one.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DAGENT_VERSION=\"2.0.0\"

; Both pins below exist to keep this buildable on Windows on ARM64. Leave them unless
; you are deliberately moving the agent to Arduino 3.x.
;
; tool-esptoolpy 2.41100.0 (what an unpinned platform resolves to) runs a postinstall that
; pip-installs "cryptography ~= 45.0.3". Cryptography has only ever shipped win_arm64
; wheels for 46.0.0+, so on ARM64 pip falls back to building it from Rust source and fails
; on the missing MSVC linker. PlatformIO then leaves the package without a package.json,
; and every later build dies with MissingPackageManifestError until you delete
; <core_dir>/packages/tool-esptoolpy by hand.
;
; 1.40501.0 (esptool 4.5.1) predates that postinstall entirely. The platform is pinned to
; 6.x alongside it because that is the combination actually verified - a 7.x platform with
; a 2023 esptool is untested. This means Arduino 2.x; the agent source handles both, via
; its ESP_ARDUINO_VERSION_MAJOR guards around the ledc calls.
;
; On x86_64 hosts none of this is necessary - unpinning both lines there is safe.
platform = espressif32@^6.9.0
platform_packages =
    platformio/tool-esptoolpy@~1.40501.0

[env:esp32dev]
board = esp32dev

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
