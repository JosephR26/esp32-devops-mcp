; ESP32 Hardware Interrogation Agent
;
; Flash this to the ESP32 that has the component(s) under interrogation attached.
; The MCP server talks to it over USB serial via scripts/hw_bridge.py.
;
; Build & flash:
;   pio run -e esp32dev -t upload
;
; The agent is passive at boot: it configures no buses and drives no GPIO until
; an explicit request names the pins to use. Once a request names a pin, the
; agent will drive it — it is a general-purpose instrument, not a read-only one.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DAGENT_VERSION=\"2.0.0\"

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
